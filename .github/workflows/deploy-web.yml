name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # These are Supabase *public* client keys (protected by Row Level
        # Security). Repository Secrets, if set, take precedence over the
        # inline fallback values.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://llhzssyzirssnhtgbooi.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaHpzc3l6aXJzc25odGdib29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MDY1NzAsImV4cCI6MjEwMDM4MjU3MH0.NfRfsn-UByLnk-40tArSTDipCPbUZ2HryenpD9LU8QM' }}
        run: |
          flutter build web --release \
            --base-href /AppEcchio/ \
            --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
